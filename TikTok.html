<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tikstatus</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body { background: #000; color: #fff; overflow: hidden; height: 100vh; }
.page { display: none; height: 100vh; width: 100vw; position: relative; }
.page.active { display: block; }

/* ЛЕНТА */
.feed { height: 100vh; width: 100vw; overflow-y: scroll; scroll-snap-type: y mandatory; }
.feed::-webkit-scrollbar { display: none; }
.video-container { height: 100vh; width: 100vw; position: relative; scroll-snap-align: start; background: #111; display: flex; justify-content: center; align-items: center; }
.video-container video { width: 100%; height: 100%; object-fit: cover; }
.text-placeholder { color: #555; font-size: 28px; font-style: italic; font-weight: bold; }

.top-nav { position: absolute; top: 40px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 20; text-shadow: 1px 1px 3px #000; }
.top-nav span { font-size: 16px; color: #aaa; font-weight: 500; }
.top-nav span.active { color: #fff; font-weight: bold; }

.video-info { position: absolute; bottom: 70px; left: 15px; width: 70%; z-index: 10; text-shadow: 1px 1px 3px #000; }
.video-info h3 { font-size: 16px; margin-bottom: 5px; }
.video-info p { font-size: 14px; margin-bottom: 8px; }
.repost-badge { display: none; color: #25f4ee; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
.repost-badge.show { display: block; }

.side-buttons { position: absolute; right: 10px; bottom: 100px; display: flex; flex-direction: column; align-items: center; gap: 18px; z-index: 10; }
.btn-wrapper { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.btn-icon-box { width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.4); border-radius: 50%; font-size: 24px; }
.btn-text { font-size: 12px; margin-top: 4px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
.liked { color: #fe2c55; }

/* НИЖНЕЕ МЕНЮ */
.bottom-nav { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; display: flex; justify-content: space-around; align-items: center; z-index: 50; border-top: 1px solid #222; }
.nav-item { font-size: 10px; color: #888; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.nav-item.active { color: #fff; }
.plus-btn { background: #fff; border-radius: 8px; width: 40px; height: 30px; display: flex; justify-content: center; align-items: center; color: #000; font-size: 24px; font-weight: bold; cursor: pointer; }

/* ПРОФИЛЬ */
.profile-header { padding: 50px 20px 20px; text-align: center; }
.avatar { width: 90px; height: 90px; border-radius: 50%; background: #333; margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-size: 35px; }
.stats { display: flex; justify-content: center; gap: 30px; margin-top: 15px; font-size: 14px; color: #aaa; }
.stats b { font-size: 18px; color: #fff; display: block; }

/* ПОИСК */
.search-box { padding: 50px 15px 15px; }
.search-box input { width: 100%; padding: 12px; background: #222; border: none; border-radius: 5px; color: #fff; }

/* СТУДИЯ ЗАГРУЗКИ */
#upload-page { display: none; flex-direction: column; height: 100vh; background: #111; }
#upload-page.active { display: flex; }
.upload-header { padding: 50px 15px 15px; display: flex; justify-content: space-between; }
.upload-body { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; }
.upload-box { width: 100%; aspect-ratio: 9/16; background: #222; border: 2px dashed #444; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; overflow: hidden; max-height: 50vh; }
.upload-box video { width: 100%; height: 100%; object-fit: cover; display: none; }
textarea { width: 100%; margin-top: 20px; background: #222; border: none; border-radius: 10px; padding: 15px; color: #fff; height: 80px; resize: none; outline: none; }
.publish-btn { width: 100%; margin-top: 20px; padding: 15px; background: #fe2c55; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }

/* МОДАЛКА КОММЕНТАРИЕВ */
.modal { position: fixed; bottom: -100%; left: 0; width: 100%; height: 60vh; background: #1a1a1a; z-index: 100; transition: bottom 0.3s; border-radius: 15px 15px 0 0; display: flex; flex-direction: column; }
.modal.open { bottom: 0; }
.modal-header { padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #333; position: relative; }
.close-btn { position: absolute; right: 15px; top: 15px; font-size: 18px; cursor: pointer; }
.comments-list { flex: 1; overflow-y: auto; padding: 15px; }
.comment { display: flex; gap: 10px; margin-bottom: 15px; }
.comment-avatar { width: 35px; height: 35px; border-radius: 50%; background: #555; display: flex; justify-content: center; align-items: center; }
.comment-user { font-size: 12px; color: #aaa; }
.comment-text { font-size: 14px; }
.input-area { padding: 10px 15px; border-top: 1px solid #333; display: flex; gap: 10px; background: #111; }
.input-area input { flex: 1; background: #222; border: none; border-radius: 20px; padding: 10px 15px; color: #fff; outline: none; }
.input-area button { background: #fe2c55; color: #fff; border: none; border-radius: 20px; padding: 0 15px; font-weight: bold; }

/* ЧАТЫ */
.chat-list { overflow-y: auto; height: calc(100vh - 100px); padding-top: 50px; }
.chat-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #222; cursor: pointer; }
.chat-avatar { width: 50px; height: 50px; border-radius: 50%; background: #333; margin-right: 15px; display: flex; justify-content: center; align-items: center; font-size: 20px; }

/* ПРОГРЕСС БАР */
#progress-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
#progress-overlay.active { display: flex; }
#progress-text { font-size: 40px; font-weight: bold; margin-bottom: 20px; }
.progress-bar-bg { width: 80%; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
#progress-bar-fill { width: 0%; height: 100%; background: #fe2c55; }
</style>
</head>
<body>

<!-- ГЛАВНАЯ -->
<div id="page-home" class="page active">
    <div class="feed" id="videoFeed"></div>
</div>

<!-- ПРОФИЛЬ -->
<div id="page-profile" class="page">
    <div class="profile-header">
        <div class="avatar">👤</div>
        <h2>@qcold</h2>
        <p style="color:#aaa;">Focsio</p>
        <div class="stats">
            <div><b>12</b>Подписки</div>
            <div><b>56</b>Подписчики</div>
            <div><b>1.2K</b>Лайки</div>
        </div>
    </div>
</div>

<!-- ПОИСК -->
<div id="page-search" class="page">
    <div class="search-box">
        <input type="text" placeholder="Поиск">
    </div>
</div>

<!-- ЧАТЫ -->
<div id="page-chats" class="page">
    <div class="chat-list">
        <div class="chat-item" onclick="alert('Чат с user: 67, Это тест, Я крут')">
            <div class="chat-avatar">U</div>
            <div>
                <div style="font-weight:bold;">user</div>
                <div style="color:#888; font-size:14px;">Я крут</div>
            </div>
        </div>
    </div>
</div>

<!-- СТУДИЯ ЗАГРУЗКИ -->
<div id="upload-page">
    <div class="upload-header">
        <span onclick="closeUpload()" style="cursor:pointer;">✖ Отмена</span>
        <h3>Новое видео</h3>
        <span style="color:transparent;">Отмена</span>
    </div>
    <div class="upload-body">
        <div class="upload-box" id="uploadBox" onclick="document.getElementById('videoInput').click()">
            <div id="uploadIcon" style="font-size: 40px;">📹</div>
            <div id="uploadText">Выбрать видео</div>
            <video id="previewVideo" controls></video>
        </div>
        <input type="file" id="videoInput" accept="video/*" style="display: none;" onchange="previewFile(event)">
        <textarea id="videoDesc" placeholder="Описание видео..."></textarea>
        <button class="publish-btn" onclick="publishVideo()">Опубликовать</button>
    </div>
</div>

<!-- МОДАЛКА КОММЕНТАРИЕВ -->
<div class="modal" id="commentsModal">
    <div class="modal-header">
        Комментарии
        <span class="close-btn" onclick="closeComments()">✖</span>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div class="input-area">
        <input type="text" id="commentInput" placeholder="Добавить...">
        <button onclick="addComment()">➤</button>
    </div>
</div>

<!-- ОВЕРЛЕЙ ЗАГРУЗКИ -->
<div id="progress-overlay">
    <div id="progress-text">0%</div>
    <div class="progress-bar-bg"><div id="progress-bar-fill"></div></div>
</div>

<!-- НИЖНЕЕ МЕНЮ -->
<div class="bottom-nav">
    <div id="nav-home" class="nav-item active" onclick="switchPage('home')">🏠<br>Главная</div>
    <div id="nav-search" class="nav-item" onclick="switchPage('search')">🔍<br>Поиск</div>
    <div class="plus-btn" onclick="openUpload()">+</div>
    <div id="nav-chats" class="nav-item" onclick="switchPage('chats')">💬<br>Чаты</div>
    <div id="nav-profile" class="nav-item" onclick="switchPage('profile')">👤<br>Профиль</div>
</div>

<script>
// Данные в памяти (не сохраняются после перезагрузки, чтобы не было багов)
let DB = [
    { 
        id: '1', 
        author: 'user1', 
        desc: 'Первое тестовое видео!', 
        likes: 124, 
        comments: [{user:'user2', text:'Круто!'}], 
        src: '',
        reposted: false
    }
];

// Переключение страниц
function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('upload-page').classList.remove('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('nav-' + page).classList.add('active');
    if(page === 'home') renderFeed();
}

// Отрисовка ленты
function renderFeed() {
    const feed = document.getElementById('videoFeed');
    feed.innerHTML = '';
    
    DB.forEach(v => {
        const div = document.createElement('div');
        div.className = 'video-container';
        
        let media = v.src ? `<video src="${v.src}" loop muted playsinline autoplay></video>` : `<div class="text-placeholder">*видео*</div>`;
        let repost = v.reposted ? `<div class="repost-badge show">🔁 user репостнул</div>` : '';

        div.innerHTML = `
            ${media}
            <div class="top-nav"><span>Подписки</span><span class="active">Для вас</span></div>
            <div class="video-info">
                ${repost}
                <h3>@${v.author}</h3>
                <p>${v.desc}</p>
            </div>
            <div class="side-buttons">
                <div class="btn-wrapper" onclick="toggleLike(this, '${v.id}')">
                    <div class="btn-icon-box" id="like-icon-${v.id}">🤍</div>
                    <div class="btn-text" id="like-count-${v.id}">${v.likes}</div>
                </div>
                <div class="btn-wrapper" onclick="openComments('${v.id}')">
                    <div class="btn-icon-box">💬</div>
                    <div class="btn-text" id="comment-count-${v.id}">${v.comments.length}</div>
                </div>
                <div class="btn-wrapper" onclick="doRepost('${v.id}')">
                    <div class="btn-icon-box">🔁</div>
                    <div class="btn-text">Репост</div>
                </div>
                <div class="btn-wrapper" onclick="alert('Ссылка скопирована!')">
                    <div class="btn-icon-box">↗️</div>
                    <div class="btn-text">Поделиться</div>
                </div>
            </div>
        `;
        feed.appendChild(div);
    });
}

// Лайки
function toggleLike(el, id) {
    const v = DB.find(x => x.id === id);
    const icon = document.getElementById('like-icon-' + id);
    const count = document.getElementById('like-count-' + id);
    if (icon.innerText === '🤍') {
        icon.innerText = '❤️';
        icon.classList.add('liked');
        v.likes++;
    } else {
        icon.innerText = '🤍';
        icon.classList.remove('liked');
        v.likes--;
    }
    count.innerText = v.likes;
}

// Репост
function doRepost(id) {
    const v = DB.find(x => x.id === id);
    if(v.reposted) return alert('Уже репостнули!');
    v.reposted = true;
    renderFeed();
}

// Комментарии
let currentVid = null;
function openComments(id) {
    currentVid = id;
    const v = DB.find(x => x.id === id);
    const list = document.getElementById('commentsList');
    list.innerHTML = '';
    v.comments.forEach(c => {
        list.innerHTML += `<div class="comment"><div class="comment-avatar">👤</div><div><div class="comment-user">@${c.user}</div><div class="comment-text">${c.text}</div></div></div>`;
    });
    document.getElementById('commentsModal').classList.add('open');
}

function closeComments() {
    document.getElementById('commentsModal').classList.remove('open');
}

function addComment() {
    const input = document.getElementById('commentInput');
    if(!input.value.trim()) return;
    const v = DB.find(x => x.id === currentVid);
    v.comments.push({user: 'qcold', text: input.value});
    document.getElementById('comment-count-' + currentVid).innerText = v.comments.length;
    document.getElementById('commentsList').innerHTML += `<div class="comment"><div class="comment-avatar" style="background:#fe2c55;">👤</div><div><div class="comment-user">@qcold</div><div class="comment-text">${input.value}</div></div></div>`;
    input.value = '';
}

// Загрузка видео
let selectedFile = null;
function openUpload() {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('upload-page').classList.add('active');
    document.getElementById('previewVideo').style.display = 'none';
    document.getElementById('uploadIcon').style.display = 'block';
    document.getElementById('uploadText').style.display = 'block';
    document.getElementById('videoDesc').value = '';
    selectedFile = null;
}

function closeUpload() {
    document.getElementById('upload-page').classList.remove('active');
    switchPage('home');
}

function previewFile(e) {
    const file = e.target.files[0];
    if(!file) return;
    selectedFile = file;
    const video = document.getElementById('previewVideo');
    video.src = URL.createObjectURL(file);
    video.style.display = 'block';
    document.getElementById('uploadIcon').style.display = 'none';
    document.getElementById('uploadText').style.display = 'none';
}

function publishVideo() {
    if(!selectedFile) return alert('Выберите видео!');
    const desc = document.getElementById('videoDesc').value || 'Без описания';
    
    document.getElementById('progress-overlay').classList.add('active');
    let prog = 0;
    const int = setInterval(() => {
        prog += 10;
        document.getElementById('progress-text').innerText = prog + '%';
        document.getElementById('progress-bar-fill').style.width = prog + '%';
        
        if(prog >= 100) {
            clearInterval(int);
            const reader = new FileReader();
            reader.onload = function(event) {
                DB.unshift({
                    id: Date.now().toString(),
                    author: 'qcold',
                    desc: desc,
                    likes: 0,
                    comments: [],
                    src: event.target.result,
                    reposted: false
                });
                setTimeout(() => {
                    document.getElementById('progress-overlay').classList.remove('active');
                    closeUpload();
                }, 300);
            };
            reader.readAsDataURL(selectedFile);
        }
    }, 50);
}

// Запуск
renderFeed();
</script>
</body>
</html>

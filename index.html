<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tikstatus - TikTok Clone</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }

/* АНИМАЦИИ */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes heartPop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes spin { 100% { transform: rotate(360deg); } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.page { display: none; height: 100vh; width: 100vw; position: relative; background: #000; }
.page.active { display: block; animation: fadeIn 0.3s ease-out; }

/* ЛЕНТА */
.feed { height: 100vh; width: 100vw; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
.feed::-webkit-scrollbar { display: none; }
.video-container { height: 100vh; width: 100vw; position: relative; scroll-snap-align: start; background: #111; }
.video-container video { width: 100%; height: 100%; object-fit: cover; }
.video-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; background: linear-gradient(transparent, rgba(0,0,0,0.8)); pointer-events: none; }
.text-placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #555; font-size: 24px; font-weight: bold; }

/* ВЕРХНЯЯ НАВИГАЦИЯ */
.top-nav { position: absolute; top: 50px; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 20; }
.top-nav span { font-size: 17px; color: rgba(255,255,255,0.6); font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.5); cursor: pointer; transition: color 0.2s; position: relative; }
.top-nav span.active { color: #fff; }
.top-nav span.active::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 25px; height: 3px; background: #fff; border-radius: 2px; }

/* ИНФОРМАЦИЯ О ВИДЕО */
.video-info { position: absolute; bottom: 80px; left: 15px; width: 75%; z-index: 10; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
.video-info h3 { font-size: 17px; margin-bottom: 8px; font-weight: 600; }
.video-info p { font-size: 15px; line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.music-info { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.music-ticker { overflow: hidden; white-space: nowrap; width: 150px; display: inline-block; }
.repost-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; margin-bottom: 10px; backdrop-filter: blur(5px); }

/* БОКОВЫЕ КНОПКИ */
.side-buttons { position: absolute; right: 10px; bottom: 80px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10; }
.btn-wrapper { display: flex; flex-direction: column; align-items: center; cursor: pointer; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
.btn-icon-box { font-size: 32px; transition: transform 0.1s; }
.btn-wrapper:active .btn-icon-box { transform: scale(0.9); }
.btn-text { font-size: 13px; margin-top: 5px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
.liked { color: #fe2c55; animation: heartPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

/* КРУТЯЩАЯСЯ ПЛАСТИНКА */
.music-disc { width: 45px; height: 45px; background: #222; border-radius: 50%; border: 7px solid #1a1a1a; display: flex; justify-content: center; align-items: center; margin-top: 10px; animation: spin 4s linear infinite; }
.music-disc img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }

/* НИЖНЕЕ МЕНЮ */
.bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; display: flex; justify-content: space-around; align-items: center; z-index: 50; border-top: 0.5px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
.feed-active .bottom-nav { background: transparent; border-top: none; }
.nav-item { font-size: 10px; color: #888; display: flex; flex-direction: column; align-items: center; cursor: pointer; gap: 4px; transition: color 0.2s; }
.nav-item.active { color: #fff; }
.nav-icon { font-size: 22px; }
.plus-btn { background: linear-gradient(to right, #25f4ee 0%, #25f4ee 50%, #fe2c55 50%, #fe2c55 100%); border-radius: 10px; padding: 2px 4px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
.plus-btn-inner { background: #fff; color: #000; border-radius: 8px; width: 38px; height: 26px; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; }
.plus-btn:active { transform: scale(0.95); }

/* ПРОФИЛЬ (БЕЛАЯ ТЕМА) */
#page-profile { background: #fff; color: #000; }
.profile-scroll-wrap { height: calc(100vh - 60px); overflow-y: auto; padding-top: 50px; }
.profile-header-title { position: absolute; top: 0; left: 0; width: 100%; height: 50px; display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 17px; background: rgba(255,255,255,0.95); backdrop-filter: blur(5px); z-index: 10; border-bottom: 1px solid #f1f1f2; }
.profile-header { padding: 20px; text-align: center; }
.avatar { width: 96px; height: 96px; border-radius: 50%; background: #f0f0f0; margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-size: 40px; overflow: hidden; border: 1px solid #ddd; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-name { font-size: 20px; font-weight: 700; margin-bottom: 5px; }
.profile-username { font-size: 15px; color: #666; margin-bottom: 20px; }
.stats { display: flex; justify-content: center; gap: 40px; margin-bottom: 20px; }
.stats-item { display: flex; flex-direction: column; align-items: center; font-size: 13px; color: #666; }
.stats-item b { font-size: 18px; color: #000; font-weight: 700; margin-bottom: 2px; }
.profile-actions { display: flex; justify-content: center; gap: 10px; }
.edit-profile-btn { padding: 10px 30px; border: 1px solid #e3e3e4; border-radius: 4px; font-weight: 600; font-size: 15px; background: transparent; cursor: pointer; }

/* СЕТКА ВИДЕО В ПРОФИЛЕ */
.profile-tabs { display: flex; border-top: 1px solid #f1f1f2; border-bottom: 1px solid #f1f1f2; }
.profile-tabs .tab { flex: 1; text-align: center; padding: 12px 0; color: #888; font-size: 22px; cursor: pointer; position: relative; }
.profile-tabs .tab.active { color: #000; }
.profile-tabs .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 40%; height: 2px; background: #000; }
.profile-video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #fff; min-height: 300px; padding-bottom: 20px; }
.grid-item { aspect-ratio: 9/16; background: #333; position: relative; cursor: pointer; }
.grid-item video { width: 100%; height: 100%; object-fit: cover; }
.grid-item .views { position: absolute; bottom: 5px; left: 5px; color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

/* ПУСТОЙ ПРОФИЛЬ */
.empty-state { grid-column: span 3; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; }
.empty-icon { font-size: 50px; color: #ccc; margin-bottom: 15px; }
.empty-title { font-weight: 700; font-size: 17px; margin-bottom: 8px; color: #000; }
.empty-desc { font-size: 14px; color: #666; }

/* ПОИСК */
#page-search { background: #111; }
.search-header { display: flex; align-items: center; padding: 50px 15px 15px; gap: 10px; border-bottom: 1px solid #222; }
.search-input-box { flex: 1; display: flex; align-items: center; background: #222; border-radius: 8px; padding: 0 12px; }
.search-input-box input { flex: 1; padding: 10px; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; }
.search-icon { color: #888; font-size: 16px; }
.clear-search { color: #888; cursor: pointer; font-size: 18px; padding: 5px; }
.cancel-search-btn { color: #fe2c55; font-size: 15px; font-weight: 600; cursor: pointer; }

.search-results { padding: 10px 15px; overflow-y: auto; height: calc(100vh - 120px); }
.user-result { display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; }
.user-result:active { background: #1a1a1a; }
.user-result-avatar { width: 50px; height: 50px; border-radius: 50%; background: #333; display: flex; justify-content: center; align-items: center; font-size: 20px; overflow: hidden; }
.user-result-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-result-info { flex: 1; }
.user-result-name { font-weight: 600; font-size: 15px; color: #fff; margin-bottom: 3px; }
.user-result-username { font-size: 13px; color: #888; }
.search-empty { color: #666; text-align: center; margin-top: 50px; font-size: 14px; }

/* ЧАТЫ */
.header-title { padding: 50px 15px 15px; text-align: center; font-size: 18px; font-weight: 600; border-bottom: 1px solid #222; }
.chat-list { overflow-y: auto; height: calc(100vh - 120px); }
.chat-item { display: flex; align-items: center; padding: 15px; cursor: pointer; }
.chat-item:active { background: #1a1a1a; }
.chat-avatar { width: 56px; height: 56px; border-radius: 50%; background: #333; margin-right: 15px; display: flex; justify-content: center; align-items: center; font-size: 24px; }
.chat-info { flex: 1; border-bottom: 1px solid #222; padding-bottom: 15px; height: 100%; display: flex; flex-direction: column; justify-content: center; }
.chat-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
.chat-msg { color: #888; font-size: 14px; }

/* МОДАЛКИ (КОММЕНТЫ И ЗАГРУЗКА) */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
.modal-overlay.active { display: block; }
.modal { position: fixed; bottom: -100%; left: 0; width: 100%; height: 65vh; background: #fff; color: #000; z-index: 100; transition: bottom 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); border-radius: 12px 12px 0 0; display: flex; flex-direction: column; }
.modal.open { bottom: 0; }
.modal-header { padding: 15px; text-align: center; font-weight: 700; font-size: 16px; position: relative; border-bottom: 1px solid #eee; }
.close-btn { position: absolute; right: 15px; top: 15px; font-size: 20px; cursor: pointer; color: #000; }
.comments-list { flex: 1; overflow-y: auto; padding: 15px; }
.comment { display: flex; gap: 12px; margin-bottom: 20px; }
.comment-avatar { width: 36px; height: 36px; border-radius: 50%; background: #eee; display: flex; justify-content: center; align-items: center; overflow: hidden; }
.comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
.comment-user { font-size: 13px; color: #666; font-weight: 600; margin-bottom: 4px; }
.comment-text { font-size: 15px; color: #000; }
.input-area { padding: 12px 15px 25px; border-top: 1px solid #eee; display: flex; gap: 10px; background: #fff; align-items: center; }
.input-area input { flex: 1; background: #f1f1f2; border: none; border-radius: 20px; padding: 12px 20px; font-size: 15px; outline: none; }
.input-area button { background: transparent; color: #fe2c55; border: none; font-weight: 700; font-size: 24px; cursor: pointer; padding-right: 5px; }

#upload-page { display: none; flex-direction: column; height: 100vh; background: #000; position: absolute; top: 0; left: 0; width: 100%; z-index: 100; }
#upload-page.active { display: flex; animation: slideUp 0.3s ease; }
.upload-header { padding: 40px 15px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
.upload-body { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; }
.upload-box { width: 100%; aspect-ratio: 9/16; max-height: 50vh; background: #1a1a1a; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; overflow: hidden; }
.upload-box video { width: 100%; height: 100%; object-fit: cover; display: none; }
textarea { width: 100%; margin-top: 20px; background: #1a1a1a; border: none; border-radius: 8px; padding: 15px; color: #fff; font-size: 15px; height: 100px; resize: none; outline: none; }
.publish-btn { width: 100%; margin-top: auto; margin-bottom: 20px; padding: 16px; background: #fe2c55; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
.publish-btn:active { opacity: 0.8; }
</style>
</head>
<body class="feed-active">

<!-- ГЛАВНАЯ ЛЕНТА -->
<div id="page-home" class="page active">
    <div class="feed" id="videoFeed"></div>
</div>

<!-- ПОИСК (ИНТЕРЕСНОЕ) -->
<div id="page-search" class="page">
    <div class="search-header">
        <div class="search-input-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Поиск пользователей по юзернейму..." oninput="handleSearch(this.value)">
            <span class="clear-search" onclick="clearSearch()">✕</span>
        </div>
        <span class="cancel-search-btn" onclick="switchPage('home')">Отмена</span>
    </div>
    <div class="search-results" id="search-results">
        <div class="search-empty">Введите имя или @username для поиска</div>
    </div>
</div>

<!-- ЧАТЫ (ВХОДЯЩИЕ) -->
<div id="page-chats" class="page">
    <div class="header-title">Входящие</div>
    <div class="chat-list">
        <div class="chat-item" onclick="alert('Открыт чат')">
            <div class="chat-avatar">👤</div>
            <div class="chat-info">
                <div class="chat-name">Новый подписчик</div>
                <div class="chat-msg">Подписался(-ась) на вас</div>
            </div>
        </div>
    </div>
</div>

<!-- ПРОФИЛЬ -->
<div id="page-profile" class="page">
    <div class="profile-header-title" id="profile-top-name">Профиль</div>
    <div class="profile-scroll-wrap">
        <div class="profile-header">
            <div class="avatar" id="profile-avatar">👤</div>
            <div class="profile-name" id="profile-name">Имя пользователя</div>
            <div class="profile-username" id="profile-username">@username</div>
            
            <div class="stats">
                <div class="stats-item"><b id="profile-following">0</b>Подписки</div>
                <div class="stats-item"><b id="profile-followers">0</b>Подписчики</div>
                <div class="stats-item"><b id="profile-likes">0</b>Лайки</div>
            </div>
            
            <div class="profile-actions">
                <button class="edit-profile-btn">НЕДОСТУПНО</button> <!-- Изменить профиль --!>
                <button class="edit-profile-btn" style="padding: 10px; width: 42px;">?</button> <!-- 🔖 --!>
            </div>
        </div>
        
        <div class="profile-tabs">
            <div class="tab active">☰</div>
        </div>
        
        <!-- СЕТКА ИЛИ ПУСТОЙ СТЕЙТ -->
        <div id="profile-video-grid" class="profile-video-grid">
            <!-- Будет заполнено через JS -->
        </div>
    </div>
</div>

<!-- СТУДИЯ ЗАГРУЗКИ -->
<div id="upload-page">
    <div class="upload-header">
        <span onclick="closeUpload()" style="cursor:pointer; font-size: 24px;">✕</span>
        <h3 style="font-size: 16px;">Новое видео</h3>
        <span style="color:transparent; font-size: 24px;">✕</span>
    </div>
    <div class="upload-body">
        <div class="upload-box" id="uploadBox" onclick="document.getElementById('videoInput').click()">
            <div id="uploadIcon" style="font-size: 40px; margin-bottom: 10px;">📸</div>
            <div id="uploadText" style="color: #888;">Нажмите для выбора</div>
            <video id="previewVideo" controls></video>
        </div>
        <input type="file" id="videoInput" accept="video/*" style="display: none;" onchange="previewFile(event)">
        <textarea id="videoDesc" placeholder="Опишите ваше видео..."></textarea>
        <button class="publish-btn" onclick="publishVideo()">Опубликовать</button>
    </div>
</div>

<!-- МОДАЛКА КОММЕНТАРИЕВ -->
<div class="modal-overlay" id="modalOverlay" onclick="closeComments()"></div>
<div class="modal" id="commentsModal">
    <div class="modal-header">
        <span id="comment-count-title">0 комментариев</span>
        <span class="close-btn" onclick="closeComments()">✕</span>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div class="input-area">
        <input type="text" id="commentInput" placeholder="Добавьте комментарий...">
        <button onclick="addComment()">⬆</button>
    </div>
</div>

<!-- НИЖНЕЕ МЕНЮ -->
<div class="bottom-nav">
    <div id="nav-home" class="nav-item active" onclick="switchPage('home')">
        <div class="nav-icon">🏠</div>
        Главная
    </div>
    <div id="nav-search" class="nav-item" onclick="switchPage('search')">
        <div class="nav-icon">🔍</div>
        Интересное
    </div>
    <div class="plus-btn" onclick="openUpload()">
        <div class="plus-btn-inner">+</div>
    </div>
    <div id="nav-chats" class="nav-item" onclick="switchPage('chats')">
        <div class="nav-icon">💬</div>
        Входящие
    </div>
    <div id="nav-profile" class="nav-item" onclick="switchPage('profile')">
        <div class="nav-icon">👤</div>
        Профиль
    </div>
</div>

<script>
// --- ИНТЕГРАЦИЯ TELEGRAM WEB APP ---
let tgUser = {
    username: 'user_unknown',
    first_name: 'Пользователь',
    photo_url: ''
};

if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.expand(); 
    tg.ready();

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const user = tg.initDataUnsafe.user;
        tgUser.username = user.username || user.first_name;
        tgUser.first_name = user.first_name;
        tgUser.photo_url = user.photo_url || '';
    }
}

// --- ОБНОВЛЕНИЕ СТАТИСТИКИ ПРОФИЛЯ ---
function updateProfileStats() {
    document.getElementById('profile-following').innerText = '0';
    document.getElementById('profile-followers').innerText = '0';
    
    // Считаем сумму всех лайков на видео текущего пользователя
    const myVideos = DB.filter(v => v.author === tgUser.username);
    const totalLikes = myVideos.reduce((sum, video) => sum + video.likes, 0);
    
    document.getElementById('profile-likes').innerText = formatNumber(totalLikes);
}

function updateProfileUI() {
    document.getElementById('profile-top-name').innerText = tgUser.first_name;
    document.getElementById('profile-name').innerText = tgUser.first_name;
    document.getElementById('profile-username').innerText = '@' + tgUser.username;
    
    if (tgUser.photo_url) {
        document.getElementById('profile-avatar').innerHTML = `<img src="${tgUser.photo_url}" alt="avatar">`;
    }
    
    updateProfileStats();
    renderProfileVideos();
}

// --- БАЗА ДАННЫХ И ПОЛЬЗОВАТЕЛИ ---
let DB = [
    { 
        id: '1', 
        author: 'tiktok_russia', 
        desc: 'Добро пожаловать в обновленный клон! 🚀 #тренды', 
        likes: 10420, 
        comments: [{user:'durov', text:'Отличный дизайн!'}], 
        src: '',
        reposted: false,
        music: 'Оригинальный звук - tiktok_russia'
    }
];



// --- НАВИГАЦИЯ ---
function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('upload-page').classList.remove('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('nav-' + page).classList.add('active');
    
    if(page === 'home') {
        document.body.classList.add('feed-active');
        renderFeed();
    } else {
        document.body.classList.remove('feed-active');
    }
    
    if(page === 'profile') {
        renderProfileVideos();
    }
}

function formatNumber(num) {
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
    return num;
}

// --- ЛЕНТА ВИДЕО ---
function renderFeed() {
    const feed = document.getElementById('videoFeed');
    feed.innerHTML = '';
    
    DB.forEach(v => {
        const div = document.createElement('div');
        div.className = 'video-container';
        
        let media = v.src ? `<video src="${v.src}" loop muted playsinline autoplay></video>` : `<div class="text-placeholder">📹 Видео</div>`;
        let repost = v.reposted ? `<div class="repost-badge">🔁 Вы репостнули</div>` : '';

        div.innerHTML = `
            ${media}
            <div class="video-overlay"></div>
            <!-- Убрали Подписки -->
            <div class="top-nav"><span class="active">Рекомендации</span></div>
            
            <div class="video-info">
                ${repost}
                <h3>@${v.author}</h3>
                <p>${v.desc}</p>
                <div class="music-info">
                    🎵 <div class="music-ticker"><marquee scrollamount="4">${v.music}</marquee></div>
                </div>
            </div>
            
            <div class="side-buttons">
                <div class="btn-wrapper" onclick="toggleLike(this, '${v.id}')">
                    <div class="btn-icon-box" id="like-icon-${v.id}">🤍</div>
                    <div class="btn-text" id="like-count-${v.id}">${formatNumber(v.likes)}</div>
                </div>
                <div class="btn-wrapper" onclick="openComments('${v.id}')">
                    <div class="btn-icon-box">💬</div>
                    <div class="btn-text" id="comment-count-${v.id}">${formatNumber(v.comments.length)}</div>
                </div>
                <div class="btn-wrapper" onclick="doRepost('${v.id}')">
                    <div class="btn-icon-box">🔁</div>
                    <div class="btn-text">Репост</div>
                </div>
                <div class="btn-wrapper" onclick="alert('Данная кнопка не работает!')">
                    <div class="btn-icon-box">↗️</div>
                    <div class="btn-text">Поделиться</div>
                </div>
                <div class="music-disc">
                    <img src="${tgUser.photo_url || 'https://via.placeholder.com/40/333/fff?text=🎵'}" alt="music">
                </div>
            </div>
        `;
        feed.appendChild(div);
    });
}

// --- ПРОФИЛЬ: СЕТКА ВИДЕО ---
function renderProfileVideos() {
    const grid = document.getElementById('profile-video-grid');
    const myVideos = DB.filter(v => v.author === tgUser.username);
    
    if (myVideos.length === 0) {
        grid.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📹</div>
                <div class="empty-title">Ни одного видео пока нет.</div>
                <div class="empty-desc">Опубликуйте свое первое видео</div>
            </div>
        `;
    } else {
        grid.innerHTML = myVideos.map(v => `
            <div class="grid-item" onclick="switchPage('home')">
                ${v.src ? `<video src="${v.src}#t=0.1" preload="metadata"></video>` : `<div style="width:100%;height:100%;background:#222;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;">📹</div>`}
                <div class="views">▷ ${formatNumber(v.likes + 15)}</div>
            </div>
        `).join('');
    }
}

// --- ПОИСК (ИНТЕРЕСНОЕ) ---
function handleSearch(query) {
    const container = document.getElementById('search-results');
    const q = query.trim().toLowerCase().replace('@', ''); 
    
    if (!q) {
        container.innerHTML = '<div class="search-empty">Введите имя или @username для поиска</div>';
        return;
    }
    
    const results = usersDB.filter(u => 
        u.username.toLowerCase().includes(q) || 
        u.name.toLowerCase().includes(q)
    );
    
    if (results.length === 0) {
        container.innerHTML = `<div class="search-empty">Пользователь не найден</div>`;
    } else {
        container.innerHTML = results.map(u => `
            <div class="user-result" onclick="alert('Переход в профиль @${u.username}')">
                <div class="user-result-avatar">
                    ${u.photo ? `<img src="${u.photo}">` : '👤'}
                </div>
                <div class="user-result-info">
                    <div class="user-result-name">${u.name}</div>
                    <div class="user-result-username">@${u.username}</div>
                </div>
            </div>
        `).join('');
    }
}

function clearSearch() {
    document.getElementById('searchInput').value = '';
    handleSearch('');
}

// --- ЛАЙКИ И РЕПОСТЫ ---
function toggleLike(el, id) {
    const v = DB.find(x => x.id === id);
    const icon = document.getElementById('like-icon-' + id);
    const count = document.getElementById('like-count-' + id);
    if (icon.innerText === '🤍') {
        icon.innerText = '❤️';
        icon.classList.add('liked');
        v.likes++;
    } else {
        icon.innerText = '🤍';
        icon.classList.remove('liked');
        v.likes--;
    }
    count.innerText = formatNumber(v.likes);
    
    updateProfileStats();
}

function doRepost(id) {
    const v = DB.find(x => x.id === id);
    if(v.reposted) return alert('Вы уже репостнули это видео');
    v.reposted = true;
    renderFeed();
}

// --- КОММЕНТАРИИ ---
let currentVid = null;
function openComments(id) {
    currentVid = id;
    const v = DB.find(x => x.id === id);
    const list = document.getElementById('commentsList');
    document.getElementById('comment-count-title').innerText = `${v.comments.length} комментариев`;
    list.innerHTML = '';
    
    v.comments.forEach(c => {
        let avatarTag = c.photo ? `<img src="${c.photo}">` : `👤`;
        list.innerHTML += `
            <div class="comment">
                <div class="comment-avatar">${avatarTag}</div>
                <div><div class="comment-user">${c.user}</div><div class="comment-text">${c.text}</div></div>
            </div>`;
    });
    
    document.getElementById('modalOverlay').classList.add('active');
    setTimeout(() => { document.getElementById('commentsModal').classList.add('open'); }, 10);
}

function closeComments() {
    document.getElementById('commentsModal').classList.remove('open');
    setTimeout(() => { document.getElementById('modalOverlay').classList.remove('active'); }, 300);
}

function addComment() {
    const input = document.getElementById('commentInput');
    if(!input.value.trim()) return;
    const v = DB.find(x => x.id === currentVid);
    
    v.comments.push({ user: tgUser.username, text: input.value, photo: tgUser.photo_url });
    
    document.getElementById('comment-count-' + currentVid).innerText = formatNumber(v.comments.length);
    document.getElementById('comment-count-title').innerText = `${v.comments.length} комментариев`;
    
    let avatarTag = tgUser.photo_url ? `<img src="${tgUser.photo_url}">` : `👤`;
    document.getElementById('commentsList').innerHTML += `
        <div class="comment" style="animation: fadeIn 0.3s ease;">
            <div class="comment-avatar">${avatarTag}</div>
            <div><div class="comment-user">${tgUser.username}</div><div class="comment-text">${input.value}</div></div>
        </div>`;
    
    input.value = '';
    const list = document.getElementById('commentsList');
    list.scrollTop = list.scrollHeight;
}

// --- ЗАГРУЗКА ВИДЕО ---
let selectedFile = null;
function openUpload() {
    document.getElementById('upload-page').classList.add('active');
    document.getElementById('previewVideo').style.display = 'none';
    document.getElementById('uploadIcon').style.display = 'block';
    document.getElementById('uploadText').style.display = 'block';
    document.getElementById('videoDesc').value = '';
    selectedFile = null;
}

function closeUpload() {
    document.getElementById('upload-page').classList.remove('active');
}

function previewFile(e) {
    const file = e.target.files[0];
    if(!file) return;
    selectedFile = file;
    const video = document.getElementById('previewVideo');
    video.src = URL.createObjectURL(file);
    video.style.display = 'block';
    document.getElementById('uploadIcon').style.display = 'none';
    document.getElementById('uploadText').style.display = 'none';
}

function publishVideo() {
    if(!selectedFile) return alert('Выберите видео для загрузки!');
    const desc = document.getElementById('videoDesc').value || 'Новое видео!';
    
    const reader = new FileReader();
    reader.onload = function(event) {
        DB.unshift({
            id: Date.now().toString(),
            author: tgUser.username,
            desc: desc,
            likes: 0,
            comments: [],
            src: event.target.result,
            reposted: false,
            music: `Оригинальный звук - ${tgUser.first_name}`
        });
        closeUpload();
        updateProfileStats();
        switchPage('profile');
    };
    reader.readAsDataURL(selectedFile);
}

// Инициализация интерфейса
updateProfileUI();
renderFeed();
</script>
